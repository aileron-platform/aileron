name: CI

on:
  push:
    paths-ignore:
      - "docs-site/**"
      - ".gitignore"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs-site/**"
      - ".gitignore"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-template:
    name: Helm Template
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render default chart
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace alpine/helm:3.16.4
          template aileron helm/aileron --namespace workspace-system
          --output-dir /tmp/rendered-default

      - name: Validate Kubernetes platform contracts
        run: >-
          docker run --rm --entrypoint /bin/sh
          -v "$PWD:/workspace" -w /workspace alpine/helm:3.16.4
          ./scripts/test/helm/assert-kubernetes-platform-contracts.sh

  platform-service-image-contract:
    name: Platform Service Image Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify restricted runtime contracts
        run: >-
          docker compose
          -f scripts/test/container/docker-compose.platform-services.yml
          run --build --rm platform-services-probe

      - name: Clean up contract containers
        if: always()
        run: >-
          docker compose
          -f scripts/test/container/docker-compose.platform-services.yml
          down --remove-orphans

  product-conformance-test:
    name: Product Conformance Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run product conformance container tests
        run: >-
          docker compose
          -f scripts/test/kubernetes/product-conformance/docker-compose.test.yml
          run --rm product-conformance-test

      - name: Run Kubernetes conformance hardening tests
        run: >-
          docker compose
          -f scripts/test/kubernetes/product-conformance/docker-compose.test.yml
          run --rm kubernetes-conformance-hardening-test

      - name: Clean up product conformance test containers
        if: always()
        run: >-
          docker compose
          -f scripts/test/kubernetes/product-conformance/docker-compose.test.yml
          down --remove-orphans

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build reusable frontend image
        run: docker buildx bake -f docker-bake.hcl --load workspace-ui

      - name: Run frontend container test
        working-directory: frontend
        run: docker compose -f docker-compose.test.yml run --rm frontend-test

  workspace-manager-test:
    name: Workspace Manager Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build reusable workspace-manager image
        run: docker buildx bake -f docker-bake.hcl --load workspace-manager

      - name: Run workspace-manager container test
        working-directory: workspace-manager
        run: docker compose -f docker-compose.test.yml run --rm workspace-manager-test

      - name: Cleanup workspace-manager test containers
        if: always()
        working-directory: workspace-manager
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  workspace-runtime-test:
    name: Workspace Runtime Test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "Docker Hub credentials are not configured; skipping login"
          fi

      - name: Build reusable workspace-runtime image
        run: docker buildx bake -f docker-bake.hcl --load workspace-runtime-lite

      - name: Run workspace-runtime container test
        working-directory: workspace-runtime
        run: docker compose -f docker-compose.test.yml run --rm workspace-runtime-test

      - name: Cleanup workspace-runtime test containers
        if: always()
        working-directory: workspace-runtime
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  workspace-operator-test:
    name: Workspace Operator Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build reusable workspace-operator test image
        run: docker buildx bake -f docker-bake.hcl --load workspace-operator-test

      - name: Run workspace-operator container test
        working-directory: workspace-operator
        run: make test-container

      - name: Cleanup workspace-operator test containers
        if: always()
        working-directory: workspace-operator
        run: make test-container-clean

  workspace-terminal-test:
    name: Workspace Terminal Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build reusable workspace-terminal test image
        run: docker buildx bake -f docker-bake.hcl --load workspace-terminal-test

      - name: Run workspace-terminal container test
        working-directory: workspace-terminal
        run: make test-container

      - name: Cleanup workspace-terminal test containers
        if: always()
        working-directory: workspace-terminal
        run: make test-container-clean
