name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "要發布的 tag 類型"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - dev
          - latest
          - both
      scope:
        description: "要發布的 image 範圍"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - base
          - services
          - runtime

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  NAMESPACE: ailerondocker

jobs:
  resolve-config:
    name: Resolve Publish Config
    runs-on: ubuntu-latest
    outputs:
      publish_dev: ${{ steps.resolve.outputs.publish_dev }}
      publish_latest: ${{ steps.resolve.outputs.publish_latest }}
      scope: ${{ steps.resolve.outputs.scope }}
      runtime_base_channel: ${{ steps.resolve.outputs.runtime_base_channel }}
    steps:
      - name: Resolve channel and scope
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          publish_dev=false
          publish_latest=false
          scope="all"
          runtime_base_channel="dev"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scope="${{ inputs.scope }}"
            case "${{ inputs.release_channel }}" in
              auto)
                if [ "${{ github.ref_name }}" = "main" ]; then
                  publish_latest=true
                  runtime_base_channel="latest"
                elif [ "${{ github.ref_name }}" = "develop" ]; then
                  publish_dev=true
                  runtime_base_channel="dev"
                else
                  publish_dev=true
                  runtime_base_channel="dev"
                fi
                ;;
              dev)
                publish_dev=true
                runtime_base_channel="dev"
                ;;
              latest)
                publish_latest=true
                runtime_base_channel="latest"
                ;;
              both)
                publish_dev=true
                publish_latest=true
                runtime_base_channel="latest"
                ;;
              *)
                echo "Unsupported release_channel: ${{ inputs.release_channel }}" >&2
                exit 1
                ;;
            esac
          else
            if [ "${{ github.ref_name }}" = "main" ]; then
              publish_latest=true
              runtime_base_channel="latest"
            elif [ "${{ github.ref_name }}" = "develop" ]; then
              publish_dev=true
              runtime_base_channel="dev"
            else
              echo "Unsupported push branch: ${{ github.ref_name }}" >&2
              exit 1
            fi
          fi

          {
            echo "publish_dev=${publish_dev}"
            echo "publish_latest=${publish_latest}"
            echo "scope=${scope}"
            echo "runtime_base_channel=${runtime_base_channel}"
          } >> "${GITHUB_OUTPUT}"

  publish-base-arch:
    name: Publish Base Arch Images
    runs-on: ubuntu-latest
    needs: resolve-config
    if: |
      (needs.resolve-config.outputs.scope == 'all' ||
      needs.resolve-config.outputs.scope == 'base' ||
      needs.resolve-config.outputs.scope == 'runtime') &&
      needs.resolve-config.outputs.publish_dev == 'true' ||
      (needs.resolve-config.outputs.scope == 'all' ||
      needs.resolve-config.outputs.scope == 'base' ||
      needs.resolve-config.outputs.scope == 'runtime') &&
      needs.resolve-config.outputs.publish_latest == 'true'
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: workspace-runtime-base-lite
            context: workspace-runtime/base-images/lite
            file: workspace-runtime/base-images/lite/Dockerfile
        platform:
          - os: linux
            arch: amd64
            value: linux/amd64
          - os: linux
            arch: arm64
            value: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          image="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}"
          arch="${{ matrix.platform.arch }}"
          tags=""

          if [ "${{ needs.resolve-config.outputs.publish_dev }}" = "true" ]; then
            tags="${tags}${image}:dev-${arch}"$'\n'
          fi

          if [ "${{ needs.resolve-config.outputs.publish_latest }}" = "true" ]; then
            tags="${tags}${image}:latest-${arch}"$'\n'
          fi

          {
            echo "tags<<EOF"
            printf "%s" "${tags}"
            echo
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve build arguments from Docker Bake
        id: bake-args
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "value<<EOF"
            docker buildx bake --print runtime-base-lite |
              jq -r '.target["runtime-base-lite"].args | to_entries[] | "\(.key)=\(.value)"'
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform.value }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.bake-args.outputs.value }}
          cache-from: type=gha,scope=base-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          provenance: false
          sbom: false

  publish-derived-base-arch:
    name: Publish Derived Base Arch Images
    runs-on: ubuntu-latest
    needs:
      - resolve-config
      - publish-base-arch
    if: |
      (needs.resolve-config.outputs.scope == 'all' ||
      needs.resolve-config.outputs.scope == 'base' ||
      needs.resolve-config.outputs.scope == 'runtime') &&
      (needs.resolve-config.outputs.publish_dev == 'true' ||
      needs.resolve-config.outputs.publish_latest == 'true')
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: workspace-runtime-base-java
            context: workspace-runtime/base-images/java21
            file: workspace-runtime/base-images/java21/Dockerfile
            parent: workspace-runtime-base-lite
            parent_context_name: workspace-runtime-base-lite
        platform:
          - os: linux
            arch: amd64
            value: linux/amd64
          - os: linux
            arch: arm64
            value: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          image="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}"
          arch="${{ matrix.platform.arch }}"
          tags=""

          if [ "${{ needs.resolve-config.outputs.publish_dev }}" = "true" ]; then
            tags="${tags}${image}:dev-${arch}"$'\n'
          fi

          if [ "${{ needs.resolve-config.outputs.publish_latest }}" = "true" ]; then
            tags="${tags}${image}:latest-${arch}"$'\n'
          fi

          {
            echo "tags<<EOF"
            printf "%s" "${tags}"
            echo
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve parent base ref
        id: parent
        shell: bash
        run: |
          set -euo pipefail

          parent_ref="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.parent }}:${{ needs.resolve-config.outputs.runtime_base_channel }}-${{ matrix.platform.arch }}"
          echo "parent_ref=${parent_ref}" >> "${GITHUB_OUTPUT}"

      - name: Resolve build arguments from Docker Bake
        id: bake-args
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "value<<EOF"
            docker buildx bake --print runtime-base-java |
              jq -r '.target["runtime-base-java"].args | to_entries[] | "\(.key)=\(.value)"'
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push derived base image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform.value }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.bake-args.outputs.value }}
          build-contexts: |
            ${{ matrix.image.parent_context_name }}=docker-image://${{ steps.parent.outputs.parent_ref }}
          cache-from: type=gha,scope=base-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          provenance: false
          sbom: false

  publish-service-arch:
    name: Publish Service Arch Images
    runs-on: ubuntu-latest
    needs: resolve-config
    if: |
      (needs.resolve-config.outputs.scope == 'all' ||
      needs.resolve-config.outputs.scope == 'services') &&
      (needs.resolve-config.outputs.publish_dev == 'true' ||
      needs.resolve-config.outputs.publish_latest == 'true')
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: workspace-ui
            tag_suffix: ""
            context: frontend
            dev_file: frontend/Dockerfile.dev
            latest_file: frontend/Dockerfile
            dev_target: ""
            latest_target: ""
            dev_bake_target: workspace-ui-production
            latest_bake_target: workspace-ui-production
          - name: workspace-manager
            tag_suffix: ""
            context: .
            dev_file: workspace-manager/Dockerfile
            latest_file: workspace-manager/Dockerfile
            dev_target: production
            latest_target: production
            dev_bake_target: workspace-manager-production
            latest_bake_target: workspace-manager-production
          - name: workspace-manager
            tag_suffix: -kubernetes
            context: .
            dev_file: workspace-manager/Dockerfile
            latest_file: workspace-manager/Dockerfile
            dev_target: kubernetes
            latest_target: kubernetes
            dev_bake_target: workspace-manager-kubernetes
            latest_bake_target: workspace-manager-kubernetes
          - name: workspace-chrome
            tag_suffix: ""
            context: workspace-chrome
            dev_file: workspace-chrome/Dockerfile.webrtc
            latest_file: workspace-chrome/Dockerfile.webrtc
            dev_target: development
            latest_target: development
            dev_bake_target: workspace-browser
            latest_bake_target: workspace-browser
          - name: workspace-chrome
            tag_suffix: -kubernetes
            context: workspace-chrome
            dev_file: workspace-chrome/Dockerfile.webrtc
            latest_file: workspace-chrome/Dockerfile.webrtc
            dev_target: kubernetes
            latest_target: kubernetes
            dev_bake_target: workspace-browser-kubernetes
            latest_bake_target: workspace-browser-kubernetes
          - name: workspace-canvas
            tag_suffix: ""
            context: workspace-canvas
            dev_file: workspace-canvas/Dockerfile
            latest_file: workspace-canvas/Dockerfile
            dev_target: development
            latest_target: development
            dev_bake_target: workspace-canvas
            latest_bake_target: workspace-canvas
          - name: workspace-canvas
            tag_suffix: -kubernetes
            context: workspace-canvas
            dev_file: workspace-canvas/Dockerfile
            latest_file: workspace-canvas/Dockerfile
            dev_target: kubernetes
            latest_target: kubernetes
            dev_bake_target: workspace-canvas-kubernetes
            latest_bake_target: workspace-canvas-kubernetes
          - name: platform-redis
            tag_suffix: ""
            context: platform/redis
            dev_file: platform/redis/Dockerfile
            latest_file: platform/redis/Dockerfile
            dev_target: ""
            latest_target: ""
            dev_bake_target: ""
            latest_bake_target: ""
          - name: platform-postgres
            tag_suffix: ""
            context: platform/postgres
            dev_file: platform/postgres/Dockerfile
            latest_file: platform/postgres/Dockerfile
            dev_target: ""
            latest_target: ""
            dev_bake_target: ""
            latest_bake_target: ""
          - name: workspace-operator
            tag_suffix: ""
            context: workspace-operator
            dev_file: workspace-operator/Dockerfile
            latest_file: workspace-operator/Dockerfile
            dev_target: ""
            latest_target: ""
            dev_bake_target: workspace-operator-kubernetes
            latest_bake_target: workspace-operator-kubernetes
        platform:
          - os: linux
            arch: amd64
            value: linux/amd64
          - os: linux
            arch: arm64
            value: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          image="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}"
          arch="${{ matrix.platform.arch }}"
          dev_tags=""
          latest_tags=""

          if [ "${{ needs.resolve-config.outputs.publish_dev }}" = "true" ]; then
            dev_tags="${dev_tags}${image}:dev${{ matrix.image.tag_suffix }}-${arch}"$'\n'
          fi

          if [ "${{ needs.resolve-config.outputs.publish_latest }}" = "true" ]; then
            latest_tags="${latest_tags}${image}:latest${{ matrix.image.tag_suffix }}-${arch}"$'\n'
          fi

          {
            echo "dev_tags<<EOF"
            printf "%s" "${dev_tags}"
            echo
            echo "EOF"
            echo "latest_tags<<EOF"
            printf "%s" "${latest_tags}"
            echo
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve build arguments from Docker Bake
        id: bake-args
        shell: bash
        env:
          DEV_BAKE_TARGET: ${{ matrix.image.dev_bake_target }}
          LATEST_BAKE_TARGET: ${{ matrix.image.latest_bake_target }}
        run: |
          set -euo pipefail
          {
            echo "dev<<EOF"
            if [ -n "${DEV_BAKE_TARGET}" ]; then
              docker buildx bake --print "${DEV_BAKE_TARGET}" |
                jq -r --arg target "${DEV_BAKE_TARGET}" \
                  '.target[$target].args // {} | to_entries[] | "\(.key)=\(.value)"'
            fi
            echo "EOF"
            echo "latest<<EOF"
            if [ -n "${LATEST_BAKE_TARGET}" ]; then
              docker buildx bake --print "${LATEST_BAKE_TARGET}" |
                jq -r --arg target "${LATEST_BAKE_TARGET}" \
                  '.target[$target].args // {} | to_entries[] | "\(.key)=\(.value)"'
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push dev service image with target
        if: ${{ needs.resolve-config.outputs.publish_dev == 'true' && matrix.image.dev_target != '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dev_file }}
          target: ${{ matrix.image.dev_target }}
          platforms: ${{ matrix.platform.value }}
          push: true
          tags: ${{ steps.tags.outputs.dev_tags }}
          build-args: ${{ steps.bake-args.outputs.dev }}
          cache-from: type=gha,scope=service-${{ matrix.image.name }}${{ matrix.image.tag_suffix }}-dev-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=service-${{ matrix.image.name }}${{ matrix.image.tag_suffix }}-dev-${{ matrix.platform.arch }}
          provenance: false
          sbom: false

      - name: Build and push dev service image without target
        if: ${{ needs.resolve-config.outputs.publish_dev == 'true' && matrix.image.dev_target == '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dev_file }}
          platforms: ${{ matrix.platform.value }}
          push: true
          tags: ${{ steps.tags.outputs.dev_tags }}
          build-args: ${{ steps.bake-args.outputs.dev }}
          cache-from: type=gha,scope=service-${{ matrix.image.name }}${{ matrix.image.tag_suffix }}-dev-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=service-${{ matrix.image.name }}${{ matrix.image.tag_suffix }}-dev-${{ matrix.platform.arch }}
          provenance: false
          sbom: false

      - name: Build and push latest service image with target
        if: ${{ needs.resolve-config.outputs.publish_latest == 'true' && matrix.image.latest_target != '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.latest_file }}
          target: ${{ matrix.image.latest_target }}
          platforms: ${{ matrix.platform.value }}
          push: true
          tags: ${{ steps.tags.outputs.latest_tags }}
          build-args: ${{ steps.bake-args.outputs.latest }}
          cache-from: type=gha,scope=service-${{ matrix.image.name }}${{ matrix.image.tag_suffix }}-latest-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=service-${{ matrix.image.name }}${{ matrix.image.tag_suffix }}-latest-${{ matrix.platform.arch }}
          provenance: false
          sbom: false

      - name: Build and push latest service image without target
        if: ${{ needs.resolve-config.outputs.publish_latest == 'true' && matrix.image.latest_target == '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.latest_file }}
          platforms: ${{ matrix.platform.value }}
          push: true
          tags: ${{ steps.tags.outputs.latest_tags }}
          build-args: ${{ steps.bake-args.outputs.latest }}
          cache-from: type=gha,scope=service-${{ matrix.image.name }}${{ matrix.image.tag_suffix }}-latest-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=service-${{ matrix.image.name }}${{ matrix.image.tag_suffix }}-latest-${{ matrix.platform.arch }}
          provenance: false
          sbom: false

  publish-runtime-arch:
    name: Publish Runtime Arch Images
    runs-on: ubuntu-latest
    needs:
      - resolve-config
      - publish-base-arch
      - publish-derived-base-arch
    if: |
      (needs.resolve-config.outputs.scope == 'all' ||
      needs.resolve-config.outputs.scope == 'runtime') &&
      (needs.resolve-config.outputs.publish_dev == 'true' ||
      needs.resolve-config.outputs.publish_latest == 'true')
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - name: lite
            internal_image: workspace-runtime-base-lite
          - name: java
            internal_image: workspace-runtime-base-java
        platform:
          - os: linux
            arch: amd64
            value: linux/amd64
          - os: linux
            arch: arm64
            value: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare runtime tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          image="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/workspace-runtime"
          flavor="${{ matrix.flavor.name }}"
          arch="${{ matrix.platform.arch }}"
          dev_tags=""
          latest_tags=""
          kubernetes_dev_tags=""
          kubernetes_latest_tags=""

          if [ "${{ needs.resolve-config.outputs.publish_dev }}" = "true" ]; then
            dev_tags="${dev_tags}${image}:dev-${flavor}-${arch}"$'\n'
            if [ "${flavor}" = "lite" ]; then
              kubernetes_dev_tags="${image}:dev-kubernetes-${arch}"$'\n'
            fi
          fi

          if [ "${{ needs.resolve-config.outputs.publish_latest }}" = "true" ]; then
            latest_tags="${latest_tags}${image}:latest-${flavor}-${arch}"$'\n'
            if [ "${flavor}" = "lite" ]; then
              kubernetes_latest_tags="${image}:latest-kubernetes-${arch}"$'\n'
            fi
          fi

          {
            echo "dev_tags<<EOF"
            printf "%s" "${dev_tags}"
            echo
            echo "EOF"
            echo "latest_tags<<EOF"
            printf "%s" "${latest_tags}"
            echo
            echo "EOF"
            echo "kubernetes_dev_tags<<EOF"
            printf "%s" "${kubernetes_dev_tags}"
            echo
            echo "EOF"
            echo "kubernetes_latest_tags<<EOF"
            printf "%s" "${kubernetes_latest_tags}"
            echo
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve runtime base image
        id: base
        shell: bash
        run: |
          set -euo pipefail

          arch="${{ matrix.platform.arch }}"

          base_ref="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.flavor.internal_image }}:${{ needs.resolve-config.outputs.runtime_base_channel }}-${arch}"

          echo "base_ref=${base_ref}" >> "${GITHUB_OUTPUT}"

      - name: Resolve build arguments from Docker Bake
        id: bake-args
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "value<<EOF"
            docker buildx bake --print workspace-runtime-lite |
              jq -r '.target["workspace-runtime-lite"].args | to_entries[] | "\(.key)=\(.value)"'
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push runtime dev image
        if: ${{ needs.resolve-config.outputs.publish_dev == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workspace-runtime/Dockerfile
          target: development
          platforms: ${{ matrix.platform.value }}
          push: true
          tags: ${{ steps.tags.outputs.dev_tags }}
          build-args: |
            ${{ steps.bake-args.outputs.value }}
            GOARCH=${{ matrix.platform.arch }}
          build-contexts: |
            runtime-base=docker-image://${{ steps.base.outputs.base_ref }}
          cache-from: type=gha,scope=runtime-dev-${{ matrix.flavor.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=runtime-dev-${{ matrix.flavor.name }}-${{ matrix.platform.arch }}
          provenance: false
          sbom: false

      - name: Build and push runtime latest image
        if: ${{ needs.resolve-config.outputs.publish_latest == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workspace-runtime/Dockerfile
          target: production
          platforms: ${{ matrix.platform.value }}
          push: true
          tags: ${{ steps.tags.outputs.latest_tags }}
          build-args: |
            ${{ steps.bake-args.outputs.value }}
            GOARCH=${{ matrix.platform.arch }}
          build-contexts: |
            runtime-base=docker-image://${{ steps.base.outputs.base_ref }}
          cache-from: type=gha,scope=runtime-latest-${{ matrix.flavor.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=runtime-latest-${{ matrix.flavor.name }}-${{ matrix.platform.arch }}
          provenance: false
          sbom: false

      - name: Build and push Kubernetes runtime dev image
        if: ${{ needs.resolve-config.outputs.publish_dev == 'true' && matrix.flavor.name == 'lite' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workspace-runtime/Dockerfile
          target: kubernetes
          platforms: ${{ matrix.platform.value }}
          push: true
          tags: ${{ steps.tags.outputs.kubernetes_dev_tags }}
          build-args: |
            ${{ steps.bake-args.outputs.value }}
            GOARCH=${{ matrix.platform.arch }}
          build-contexts: |
            runtime-base=docker-image://${{ steps.base.outputs.base_ref }}
          cache-from: type=gha,scope=runtime-kubernetes-dev-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=runtime-kubernetes-dev-${{ matrix.platform.arch }}
          provenance: false
          sbom: false

      - name: Build and push Kubernetes runtime latest image
        if: ${{ needs.resolve-config.outputs.publish_latest == 'true' && matrix.flavor.name == 'lite' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workspace-runtime/Dockerfile
          target: kubernetes
          platforms: ${{ matrix.platform.value }}
          push: true
          tags: ${{ steps.tags.outputs.kubernetes_latest_tags }}
          build-args: |
            ${{ steps.bake-args.outputs.value }}
            GOARCH=${{ matrix.platform.arch }}
          build-contexts: |
            runtime-base=docker-image://${{ steps.base.outputs.base_ref }}
          cache-from: type=gha,scope=runtime-kubernetes-latest-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=runtime-kubernetes-latest-${{ matrix.platform.arch }}
          provenance: false
          sbom: false

  publish-service-manifests:
    name: Publish Service Multi-Arch Manifests
    runs-on: ubuntu-latest
    needs:
      - resolve-config
      - publish-service-arch
    if: |
      (needs.resolve-config.outputs.scope == 'all' ||
      needs.resolve-config.outputs.scope == 'services') &&
      (needs.resolve-config.outputs.publish_dev == 'true' ||
      needs.resolve-config.outputs.publish_latest == 'true')
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: workspace-ui
            tag_suffix: ""
          - name: workspace-manager
            tag_suffix: ""
          - name: workspace-manager
            tag_suffix: -kubernetes
          - name: workspace-chrome
            tag_suffix: ""
          - name: workspace-chrome
            tag_suffix: -kubernetes
          - name: workspace-canvas
            tag_suffix: ""
          - name: workspace-canvas
            tag_suffix: -kubernetes
          - name: platform-redis
            tag_suffix: ""
          - name: platform-postgres
            tag_suffix: ""
          - name: workspace-operator
            tag_suffix: ""
    steps:
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish dev manifest
        if: ${{ needs.resolve-config.outputs.publish_dev == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}"
          target="${image}:dev${{ matrix.image.tag_suffix }}"
          docker buildx imagetools create \
            --tag "${target}" \
            "${target}-amd64" \
            "${target}-arm64"
          docker buildx imagetools inspect "${target}"

      - name: Publish latest manifest
        if: ${{ needs.resolve-config.outputs.publish_latest == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}"
          target="${image}:latest${{ matrix.image.tag_suffix }}"
          docker buildx imagetools create \
            --tag "${target}" \
            "${target}-amd64" \
            "${target}-arm64"
          docker buildx imagetools inspect "${target}"

  publish-runtime-manifests:
    name: Publish Runtime Multi-Arch Manifests
    runs-on: ubuntu-latest
    needs:
      - resolve-config
      - publish-runtime-arch
    if: |
      (needs.resolve-config.outputs.scope == 'all' ||
      needs.resolve-config.outputs.scope == 'runtime') &&
      (needs.resolve-config.outputs.publish_dev == 'true' ||
      needs.resolve-config.outputs.publish_latest == 'true')
    strategy:
      fail-fast: false
      matrix:
        tag_suffix:
          - -lite
          - -kubernetes
    steps:
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish dev manifest
        if: ${{ needs.resolve-config.outputs.publish_dev == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/workspace-runtime:dev${{ matrix.tag_suffix }}"
          docker buildx imagetools create \
            --tag "${target}" \
            "${target}-amd64" \
            "${target}-arm64"
          docker buildx imagetools inspect "${target}"

      - name: Publish latest manifest
        if: ${{ needs.resolve-config.outputs.publish_latest == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/workspace-runtime:latest${{ matrix.tag_suffix }}"
          docker buildx imagetools create \
            --tag "${target}" \
            "${target}-amd64" \
            "${target}-arm64"
          docker buildx imagetools inspect "${target}"
