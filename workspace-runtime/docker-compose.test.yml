services:
  # PostgreSQL test database
  postgres-test:
    image: postgres:15-alpine
    container_name: workspace-runtime-postgres-test
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_workspace_runtime
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5435:5432"
    volumes:
      # Optional initialization script
      - ./tests/fixtures/test-db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_workspace_runtime"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Use tmpfs to improve test speed.
    tmpfs:
      - /var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=128MB
        -c max_connections=100
        -c log_statement=all
        -c log_duration=on
        -c fsync=off
        -c synchronous_commit=off
        -c full_page_writes=off
    networks:
      - test-network

  # Redis test instance
  redis-test:
    image: redis:7-alpine
    container_name: workspace-runtime-redis-test
    ports:
      - "6382:6379"
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
        --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - test-network

  # Workspace Runtime test container
  workspace-runtime-test:
    build:
      # The Dockerfile uses workspace-runtime/... paths, so the build context
      # must point at the repo root to resolve COPY statements correctly.
      context: ..
      dockerfile: workspace-runtime/Dockerfile
      target: development
      args:
        OPENSPEC_VERSION: ${WORKSPACE_RUNTIME_OPENSPEC_VERSION:-1.3.0}
        CLAUDE_CLI_VERSION: ${WORKSPACE_RUNTIME_CLAUDE_CLI_VERSION:-stable}
        GEMINI_VERSION: ${WORKSPACE_RUNTIME_GEMINI_VERSION:-latest}
        AGENT_BROWSER_CLI_VERSION: ${WORKSPACE_RUNTIME_AGENT_BROWSER_CLI_VERSION:-0.23.0}
        CODEX_CLI_VERSION: ${WORKSPACE_RUNTIME_CODEX_CLI_VERSION:-latest}
      # workspace-runtime/Dockerfile starts with FROM runtime-base, so this
      # test compose file must provide the corresponding prebuilt base image.
      additional_contexts:
        runtime-base: docker-image://${WORKSPACE_RUNTIME_BASE_IMAGE:-ailerondocker/codex-universal:latest-amd64}
    container_name: workspace-runtime-test
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    environment:
      # Database configuration
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@postgres-test:5432/test_workspace_runtime
      # Redis configuration
      REDIS_URL: redis://redis-test:6379/0
      # Test environment marker
      TESTING: "true"
      PYTHONPATH: /app
      # Log level
      LOG_LEVEL: DEBUG
    volumes:
      # Mount code in development mode.
      - ./app:/app/app:ro
      - ./agent-defaults:/app/agent-defaults:ro
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:rw
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - ./vendor:/app/vendor:ro
      - ./README.md:/app/README.md:ro
      # Test result output
      - ./test-results:/app/test-results:rw
      - ./htmlcov:/app/htmlcov:rw
      # Test workspace
      - test_workspace:/workspace
    working_dir: /app
    networks:
      - test-network
    # Test command, overridable at runtime.
    command: >
      sh -c "
        echo '🔧 Installing dependencies...' &&
        uv sync --all-extras &&
        echo '🧪 Running tests...' &&
        uv run pytest tests/ --cov=app --cov-report=term-missing --cov-report=html:htmlcov --cov-report=json:test-results/coverage.json --junit-xml=test-results/junit.xml -v --maxfail=5
      "

volumes:
  test_workspace:
    driver: local

networks:
  test-network:
    name: workspace-runtime-test-network
    driver: bridge
