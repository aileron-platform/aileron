apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aileron-site.fullname" . }}
  labels:
{{ include "aileron-site.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aileron-site.name" . | quote }}
      app.kubernetes.io/instance: {{ include "aileron-site.fullname" . | quote }}
  template:
    metadata:
      labels:
{{ include "aileron-site.labels" . | indent 8 }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: {{ required "imagePullSecretName is required" .Values.imagePullSecretName | quote }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: site
          image: {{ required "image.repository is required" .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
