apiVersion: v1
kind: Service
metadata:
  name: {{ include "aileron-site.fullname" . }}
  labels:
{{ include "aileron-site.labels" . | indent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "aileron-site.name" . | quote }}
    app.kubernetes.io/instance: {{ include "aileron-site.fullname" . | quote }}
  ports:
    - name: http
      port: 80
      targetPort: http
