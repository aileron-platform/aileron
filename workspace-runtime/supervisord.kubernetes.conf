[supervisord]
nodaemon=true
logfile=/tmp/supervisor/supervisord.log
pidfile=/tmp/supervisor/supervisord.pid
childlogdir=/tmp/supervisor
loglevel=info

[unix_http_server]
file=/tmp/supervisor/supervisor.sock
chmod=0600

[supervisorctl]
serverurl=unix:///tmp/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:fastapi]
command=/workspace-runtime/.venv/bin/python -m app.main
directory=/workspace-runtime
autostart=true
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
environment=PYTHONPATH="/workspace-runtime:/workspace",PYTHONUNBUFFERED="1",PATH="%(ENV_PATH)s",HOME="%(ENV_HOME)s",XDG_CONFIG_HOME="%(ENV_XDG_CONFIG_HOME)s",XDG_DATA_HOME="%(ENV_XDG_DATA_HOME)s",XDG_STATE_HOME="%(ENV_XDG_STATE_HOME)s",CODEX_HOME="%(ENV_CODEX_HOME)s",MARKETPLACE_OPERATION_JOURNAL_DIR="%(ENV_MARKETPLACE_OPERATION_JOURNAL_DIR)s",NPM_CONFIG_PREFIX="%(ENV_NPM_CONFIG_PREFIX)s",NPM_CONFIG_CACHE="%(ENV_NPM_CONFIG_CACHE)s",UV_CACHE_DIR="%(ENV_UV_CACHE_DIR)s"
priority=200

[eventlistener:fastapi-exit-listener]
command=/workspace-runtime/.venv/bin/python /workspace-runtime/scripts/supervisor_exit_on_fastapi_failure.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:terminal-service]
command=/workspace-runtime/scripts/terminal_service.sh --exec
directory=/workspace-terminal
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
environment=TERMINAL_PORT="3004",LOG_LEVEL="info",PATH="%(ENV_PATH)s",HOME="%(ENV_HOME)s",CODEX_HOME="%(ENV_CODEX_HOME)s",XDG_CONFIG_HOME="%(ENV_XDG_CONFIG_HOME)s",XDG_DATA_HOME="%(ENV_XDG_DATA_HOME)s",XDG_STATE_HOME="%(ENV_XDG_STATE_HOME)s",NPM_CONFIG_PREFIX="%(ENV_NPM_CONFIG_PREFIX)s",NPM_CONFIG_CACHE="%(ENV_NPM_CONFIG_CACHE)s",UV_CACHE_DIR="%(ENV_UV_CACHE_DIR)s"
priority=400
