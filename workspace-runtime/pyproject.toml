[project]
name = "aileron-workspace-runtime"
version = "1.0.0"
description = "Aileron - Workspace Runtime 容器運行時服務，提供開發環境執行支援"
authors = [
    {name = "Aileron Team", email = "dev@aileron.com"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["runtime", "container", "workspace", "claude", "ai", "development"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    # 核心框架
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # HTTP 客戶端和檔案處理
    "aiohttp>=3.9.1",
    "aiofiles>=23.2.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    # WebSocket 支援
    "websockets>=11.0.3",
    # Redis 快取和狀態管理
    "redis>=5.0.0",
    # 終端機互動
    "pexpect>=4.9.0",
    # 環境配置
    "python-dotenv>=1.0.0",
    # 檔案系統監控
    "watchdog>=3.0.0",
    # 系統監控
    "psutil>=5.9.0",
    # Claude Code 整合
    "anthropic>=0.3.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    # 程序管理
    "supervisor>=4.2.0",
    # 檔案處理
    "gitpython>=3.1.0",
    "pathspec>=0.11.0",
    "pillow>=11.0.0",
    # 模板引擎
    "jinja2>=3.1.0",
    # 系統工具
    "click>=8.1.0",
    "claude-agent-sdk>=0.1.50",
    "agent-client-protocol>=0.7.1",
    "requests>=2.32.5",
    "greenlet>=3.2.4",
    # JWT 認證 (Keycloak OAuth2)
    "python-jose[cryptography]>=3.3.0",
    # TOML 支援（Codex CLI 設定檔）
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "openai-codex-app-server-sdk==0.116.0a1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "coverage>=7.3.0",
    "pre-commit>=3.5.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/aileron/workspace-runtime"
Repository = "https://github.com/aileron/workspace-runtime.git"
Documentation = "https://docs.aileron.com/workspace-runtime"
Issues = "https://github.com/aileron/workspace-runtime/issues"

[project.scripts]
workspace-runtime = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "coverage>=7.3.0",
    "pre-commit>=3.5.0",
    "httpx>=0.25.0",
    "ruff>=0.14.2",
    "fakeredis>=2.32.1",
    "asyncpg>=0.30.0",
    "pytest-mock>=3.15.1",
]

[tool.uv.sources]
openai-codex-app-server-sdk = { path = "vendor/codex_app_server" }

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.env
  | build
  | dist
  | workspace
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "supervisor.*",
    "psutil.*",
    "watchdog.*",
    "git.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/workspace/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
