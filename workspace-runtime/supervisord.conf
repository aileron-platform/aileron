[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/sshd.err.log
stdout_logfile=/var/log/supervisor/sshd.out.log
priority=100

[program:fastapi]
command=/workspace-runtime/.venv/bin/python -m app.main
directory=/workspace-runtime
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/fastapi.err.log
stdout_logfile=/var/log/supervisor/fastapi.out.log
environment=PYTHONPATH=/workspace-runtime:/workspace,PYTHONUNBUFFERED=1,PATH=%(ENV_PATH)s,HOME=/home/developer,NPM_CONFIG_PREFIX=/home/developer/.npm-global,CARGO_HOME=/home/developer/.cargo,RUSTUP_HOME=/root/.rustup
user=developer
priority=200

# Canvas renderer has moved to the standalone workspace-canvas container.

[program:terminal-service]
command=/workspace-runtime/scripts/terminal_service.sh --exec
directory=/workspace-terminal
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/terminal-service.err.log
stdout_logfile=/var/log/supervisor/terminal-service.out.log
environment=TERMINAL_PORT=3004,REDIS_HOST=redis,REDIS_PORT=6379,REDIS_DB=0,LOG_LEVEL=info,MAX_TABS_PER_WORKSPACE=10,SESSION_TIMEOUT=300,PTY_BUFFER_SIZE=1024,PATH=%(ENV_PATH)s,HOME=/home/developer,CARGO_HOME=/home/developer/.cargo,RUSTUP_HOME=/root/.rustup
user=developer
priority=400
