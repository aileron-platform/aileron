    <line x1="6.4" y1="10.88" x2="6.4" y2="7.4239999999999995" stroke="white" stroke-width="0.24" stroke-linecap="round" opacity="0.7"/>
    <line x1="1.92" y1="6.4" x2="5.376" y2="6.4" stroke="white" stroke-width="0.24" stroke-linecap="round" opacity="0.7"/>
    <line x1="10.88" y1="6.4" x2="7.4239999999999995" y2="6.4" stroke="white" stroke-width="0.24" stroke-linecap="round" opacity="0.7"/>
