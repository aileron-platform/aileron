    <circle cx="3.2" cy="3.2" r="0.768" fill="white"/>
    <circle cx="9.600000000000001" cy="3.2" r="0.768" fill="white"/>
    <circle cx="3.2" cy="9.600000000000001" r="0.768" fill="white"/>
    <circle cx="9.600000000000001" cy="9.600000000000001" r="0.768" fill="white"/>

    <!-- Side nodes -->
    <circle cx="6.4" cy="1.92" r="0.576" fill="url(#accentGradient)"/>
    <circle cx="6.4" cy="10.88" r="0.576" fill="url(#accentGradient)"/>
