    <line x1="9.600000000000001" y1="3.2" x2="6.4" y2="6.4" stroke="white" stroke-width="0.32" stroke-linecap="round" opacity="0.9"/>
    <line x1="3.2" y1="9.600000000000001" x2="6.4" y2="6.4" stroke="white" stroke-width="0.32" stroke-linecap="round" opacity="0.9"/>
    <line x1="9.600000000000001" y1="9.600000000000001" x2="6.4" y2="6.4" stroke="white" stroke-width="0.32" stroke-linecap="round" opacity="0.9"/>

