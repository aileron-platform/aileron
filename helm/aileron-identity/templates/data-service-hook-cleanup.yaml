{{- if not .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: aileron-identity-data-service-preflight
  labels:
    {{- include "aileron-identity.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-service-hook-cleanup
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data: {}
{{- end }}
