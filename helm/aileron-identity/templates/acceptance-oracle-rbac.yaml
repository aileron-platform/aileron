apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aileron-acceptance-oracle
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "aileron-identity.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["aileron-identity-keycloak"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["aileron-identity-backup"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aileron-identity-restore-marker"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aileron-acceptance-oracle
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "aileron-identity.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: aileron-acceptance-oracle
    namespace: workspace-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aileron-acceptance-oracle
