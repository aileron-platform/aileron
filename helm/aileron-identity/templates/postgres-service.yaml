{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: aileron-identity-postgres
  labels:
    {{- include "aileron-identity.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: aileron-identity-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
