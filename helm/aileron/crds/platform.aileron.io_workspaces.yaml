apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspaces.platform.aileron.io
spec:
  group: platform.aileron.io
  scope: Namespaced
  names:
    plural: workspaces
    singular: workspace
    kind: Workspace
    shortNames:
      - ws
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - workspaceId
                - ownerId
                - provisioner
                - runtime
                - browser
                - canvas
                - workspacePath
                - firewall
              properties:
                workspaceId:
                  type: string
                  minLength: 1
                ownerId:
                  type: string
                  minLength: 1
                provisioner:
                  type: string
                  enum:
                    - kubernetes
                runtime:
                  type: object
                  required:
                    - imageKey
                  properties:
                    imageKey:
                      type: string
                    image:
                      type: string
                    resources:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    agentState:
                      type: object
                      required:
                        - pvcName
                        - subPathRoot
                        - mounts
                      properties:
                        pvcName:
                          type: string
                        subPathRoot:
                          type: string
                        mounts:
                          type: array
                          items:
                            type: object
                            required:
                              - provider
                              - sourceSubPath
                              - mountPath
                            properties:
                              provider:
                                type: string
                              sourceSubPath:
                                type: string
                              mountPath:
                                type: string
                browser:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    image:
                      type: string
                    resources:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                canvas:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    image:
                      type: string
                    resources:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                git:
                  type: object
                  properties:
                    url:
                      type: string
                    branch:
                      type: string
                workspacePath:
                  type: string
                targetNamespace:
                  type: string
                envVars:
                  type: array
                  items:
                    type: object
                    required:
                      - key
                      - value
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                knowledgeBases:
                  type: array
                  items:
                    type: object
                    required:
                      - kbId
                      - mountAlias
                    properties:
                      kbId:
                        type: string
                      mountAlias:
                        type: string
                      readOnly:
                        type: boolean
                operations:
                  type: object
                  properties:
                    restartWorkspaceAt:
                      type: string
                      format: date-time
                    restartRuntimeAt:
                      type: string
                      format: date-time
                    restartBrowserAt:
                      type: string
                      format: date-time
                    restartCanvasAt:
                      type: string
                      format: date-time
                firewall:
                  type: object
                  required:
                    - workspace
                    - browser
                  properties:
                    workspace:
                      type: object
                      required:
                        - networkAccessEnabled
                        - domainAccessMode
                        - allowedDomains
                      properties:
                        networkAccessEnabled:
                          type: boolean
                        domainAccessMode:
                          type: string
                          enum:
                            - all
                            - specific
                        allowedDomains:
                          type: array
                          items:
                            type: string
                    browser:
                      type: object
                      required:
                        - networkAccessEnabled
                        - domainAccessMode
                        - allowedDomains
                      properties:
                        networkAccessEnabled:
                          type: boolean
                        domainAccessMode:
                          type: string
                          enum:
                            - all
                            - specific
                        allowedDomains:
                          type: array
                          items:
                            type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                targetNamespace:
                  type: string
                components:
                  type: object
                  properties:
                    runtime:
                      type: object
                      properties:
                        phase:
                          type: string
                        internalUrl:
                          type: string
                        externalUrl:
                          type: string
                        lastRestartedAt:
                          type: string
                          format: date-time
                    browser:
                      type: object
                      properties:
                        phase:
                          type: string
                        internalUrl:
                          type: string
                        externalUrl:
                          type: string
                        lastRestartedAt:
                          type: string
                          format: date-time
                    canvas:
                      type: object
                      properties:
                        phase:
                          type: string
                        internalUrl:
                          type: string
                        externalUrl:
                          type: string
                        lastRestartedAt:
                          type: string
                          format: date-time
                firewall:
                  type: object
                  properties:
                    workspace:
                      type: object
                      properties:
                        effectiveAllowedDomains:
                          type: array
                          items:
                            type: string
                    browser:
                      type: object
                      properties:
                        effectiveAllowedDomains:
                          type: array
                          items:
                            type: string
      additionalPrinterColumns:
        - name: Workspace ID
          type: string
          jsonPath: .spec.workspaceId
        - name: Owner
          type: string
          jsonPath: .spec.ownerId
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Namespace
          type: string
          jsonPath: .status.targetNamespace
