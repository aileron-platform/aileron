kubernetes:
  workspaceRuntimeNamespace: workspace-system
  platformStorageGid: null
  workspaceData:
    storageClassName: ocs-storagecluster-cephfs
  runtimeHome:
    accessMode: ReadWriteOnce
    storageClassName: ocs-storagecluster-ceph-rbd
  knowledgeBases:
    accessModes:
      - ReadWriteMany
    storageClassName: ocs-storagecluster-cephfs
  managerState:
    accessModes:
      - ReadWriteOnce
    storageClassName: ocs-storagecluster-ceph-rbd
  storageVerification:
    enabled: true
    workspaceStorageClassName: ocs-storagecluster-cephfs-verification-delete
    managerStateStorageClassName: ocs-storagecluster-ceph-rbd-verification-delete
    workspaceSize: 1Gi
    managerStateSize: 1Gi

frontend:
  enabled: true
  dnsResolver: dns-default.openshift-dns.svc.cluster.local
postgres:
  enabled: false
platformDatabase: {revision: platform-database-v1}
redis:
  enabled: false
  connections:
    general: {urlSecretName: platform-redis-general, urlSecretKey: url, revision: redis-general-v1}
    jobQueue: {urlSecretName: platform-redis-job-queue, urlSecretKey: url, revision: redis-job-queue-v1}
    jobResult: {urlSecretName: platform-redis-job-result, urlSecretKey: url, revision: redis-job-result-v1}
ingress:
  enabled: false
oidc:
  issuerUrl: https://login.example.com/realms/aileron
  clientSecretName: external-oidc-client
bootstrap:
  admin:
    enabled: false
