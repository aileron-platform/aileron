kubernetes:
  workspaceRuntimeNamespace: workspace-system
  platformStorageGid: 2000
  workspaceData:
    storageClassName: longhorn-rwx
  runtimeHome:
    accessMode: ReadWriteOnce
    storageClassName: longhorn
  knowledgeBases:
    accessModes:
      - ReadWriteMany
    storageClassName: longhorn-rwx
  managerState:
    accessModes:
      - ReadWriteOnce
    storageClassName: longhorn
  storageVerification:
    enabled: true
    workspaceStorageClassName: longhorn-rwx-verification-delete
    managerStateStorageClassName: longhorn-verification-delete
    workspaceSize: 1Gi
    managerStateSize: 1Gi

frontend:
  enabled: true
  dnsResolver: rke2-coredns-rke2-coredns.kube-system.svc.cluster.local
postgres:
  enabled: false
platformDatabase: {revision: platform-database-v1}
redis:
  enabled: false
  connections:
    general: {urlSecretName: platform-redis-general, urlSecretKey: url, revision: redis-general-v1}
    jobQueue: {urlSecretName: platform-redis-job-queue, urlSecretKey: url, revision: redis-job-queue-v1}
    jobResult: {urlSecretName: platform-redis-job-result, urlSecretKey: url, revision: redis-job-result-v1}
ingress:
  enabled: false
oidc:
  issuerUrl: https://login.example.com/realms/aileron
  clientSecretName: external-oidc-client
bootstrap:
  admin:
    enabled: false
