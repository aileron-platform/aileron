{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aileron.fullname" . }}
  labels:
    {{- include "aileron.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ include "aileron.platformPublicHostname" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aileron.fullname" . }}-frontend
                port:
                  name: http
  {{- if eq .Values.ingress.tlsMode "kubernetesSecret" }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecretName | quote }}
      hosts:
        - {{ include "aileron.platformPublicHostname" . | quote }}
  {{- end }}
{{- end }}
