{{- if and .Values.kubernetes.enabled .Values.workspaceManager.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.kubernetes.managerState.pvcName }}
  namespace: {{ include "aileron.workspaceRuntimeNamespace" . | quote }}
  labels:
    {{- include "aileron.labels" . | nindent 4 }}
    app.kubernetes.io/component: workspace-manager-state
spec:
  accessModes:
    {{- toYaml .Values.kubernetes.managerState.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.kubernetes.managerState.size }}
  {{- if .Values.kubernetes.managerState.storageClassName }}
  storageClassName: {{ .Values.kubernetes.managerState.storageClassName | quote }}
  {{- else }}
  {{- include "aileron.storageClassName" . | nindent 2 }}
  {{- end }}
{{- end }}
