{{- if .Values.workspaceRuntimePrepuller.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "aileron.fullname" . }}-workspace-runtime-prepuller
  namespace: {{ include "aileron.workspaceRuntimeNamespace" . | quote }}
  labels:
    {{- include "aileron.labels" . | nindent 4 }}
    app.kubernetes.io/component: workspace-runtime-prepuller
spec:
  selector:
    matchLabels:
      {{- include "aileron.componentLabels" (dict "component" "workspace-runtime-prepuller" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aileron.componentPodLabels" (dict "component" "workspace-runtime-prepuller" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 8 }}
      annotations:
        checksum/runtime-image: {{ include "aileron.imageReference" (dict "name" "workspaceOperator.runtimeImage" "image" .Values.workspaceOperator.runtimeImage "production" .Values.security.requireStrongSecrets) | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- include "aileron.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.workspaceRuntimePrepuller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workspaceRuntimePrepuller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 0
      initContainers:
        - name: pull-workspace-runtime
          image: {{ include "aileron.imageReference" (dict "name" "workspaceOperator.runtimeImage" "image" .Values.workspaceOperator.runtimeImage "production" .Values.security.requireStrongSecrets) | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - echo image ready
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.workspaceRuntimePrepuller.resources | nindent 12 }}
{{- end }}
