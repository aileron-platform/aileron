{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aileron.fullname" . }}-frontend-nginx
  labels:
    {{- include "aileron.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        sendfile        on;
        keepalive_timeout  65;
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }

        resolver {{ .Values.frontend.dnsResolver }} valid=10s ipv6=off;

        server {
            listen       8082;
            server_name  localhost;

            root   /tmp/aileron-html;
            index  index.html index.htm;

            location = /index.html {
                add_header Cache-Control "no-store, no-cache, must-revalidate";
            }

            location / {
                try_files $uri $uri/ /index.html;
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            {{- if and .Values.turn.enabled .Values.connectivityEvidenceGateway.enabled }}
            location ^~ /api/v1/connectivity-evidence {
                proxy_pass http://{{ include "aileron.fullname" . }}-connectivity-evidence-gateway.{{ .Release.Namespace }}.svc.cluster.local:8083;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_set_header Authorization $http_authorization;
                proxy_set_header Cookie "";
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_cache off;
                proxy_read_timeout 60s;
                proxy_send_timeout 60s;
            }
            {{- end }}

            location /api/v1 {
                proxy_pass http://{{ include "aileron.fullname" . }}-workspace-manager.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.workspaceManager.service.port }};
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_set_header Authorization $http_authorization;
                proxy_set_header Cookie $http_cookie;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_cache off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }

            location = /_aileron_workspace_gateway_authorize {
                internal;
                proxy_pass http://{{ include "aileron.fullname" . }}-workspace-manager.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.workspaceManager.service.port }}/api/v1/workspaces/gateway/authorize;
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";
                proxy_set_header X-Aileron-Workspace-Id $workspace_id;
                proxy_set_header Cookie "aileron_session=$cookie_aileron_workspace_gateway_session";
                proxy_set_header Authorization "";
                proxy_set_header Proxy-Authorization "";
                proxy_set_header X-API-Key "";
                proxy_set_header X-CSRF-Token "";
            }

            location ~ "^/workspaces/(?<workspace_id>[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/runtime/ws/terminal(?<gateway_path>/.*)?$" {
                auth_request /_aileron_workspace_gateway_authorize;
                rewrite ^/workspaces/[0-9a-f-]+/runtime(/.*)$ $1 break;
                proxy_pass http://workspace-runtime-$workspace_id.{{ .Release.Namespace }}.svc.cluster.local:3004;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_set_header X-Forwarded-Prefix /workspaces/$workspace_id/runtime;
                proxy_set_header Authorization $http_authorization;
                proxy_set_header Cookie "";
                proxy_set_header Proxy-Authorization "";
                proxy_set_header X-API-Key "";
                proxy_set_header X-CSRF-Token "";
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_cache off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }

            location ~ "^/workspaces/(?<workspace_id>[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/runtime/.+" {
                auth_request /_aileron_workspace_gateway_authorize;
                rewrite ^/workspaces/[0-9a-f-]+/runtime(/.*)$ $1 break;
                proxy_pass http://workspace-runtime-$workspace_id.{{ .Release.Namespace }}.svc.cluster.local:3002;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_set_header X-Forwarded-Prefix /workspaces/$workspace_id/runtime;
                proxy_set_header Authorization $http_authorization;
                proxy_set_header Cookie "";
                proxy_set_header Proxy-Authorization "";
                proxy_set_header X-API-Key "";
                proxy_set_header X-CSRF-Token "";
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_cache off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }

            location ~ "^/workspaces/(?<workspace_id>[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/browser/.+" {
                auth_request /_aileron_workspace_gateway_authorize;
                rewrite ^/workspaces/[0-9a-f-]+/browser(/.*)$ $1 break;
                proxy_pass http://workspace-browser-$workspace_id.{{ .Release.Namespace }}.svc.cluster.local:6080;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_set_header X-Forwarded-Prefix /workspaces/$workspace_id/browser;
                proxy_set_header Authorization "";
                proxy_set_header Cookie "";
                proxy_set_header Proxy-Authorization "";
                proxy_set_header X-API-Key "";
                proxy_set_header X-CSRF-Token "";
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_cache off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }

            location ~ "^/workspaces/(?<workspace_id>[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/canvas/.+" {
                auth_request /_aileron_workspace_gateway_authorize;
                rewrite ^/workspaces/[0-9a-f-]+/canvas(/.*)$ $1 break;
                proxy_pass http://workspace-canvas-$workspace_id.{{ .Release.Namespace }}.svc.cluster.local:3003;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_set_header X-Forwarded-Prefix /workspaces/$workspace_id/canvas;
                proxy_set_header Authorization "";
                proxy_set_header Cookie "";
                proxy_set_header Proxy-Authorization "";
                proxy_set_header X-API-Key "";
                proxy_set_header X-CSRF-Token "";
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_cache off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }

            error_page   500 502 503 504  /50x.html;
            location = /50x.html {
                root   /tmp/aileron-html;
            }
        }
    }
{{- end }}
