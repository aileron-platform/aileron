{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aileron.fullname" . }}-frontend-nginx
  labels:
    {{- include "aileron.labels" . | nindent 4 }}
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        sendfile        on;
        keepalive_timeout  65;

        upstream workspace_manager_upstream {
            server {{ include "aileron.fullname" . }}-workspace-manager:{{ .Values.workspaceManager.service.port }};
        }

        server {
            listen       8082;
            server_name  localhost;

            root   /usr/share/nginx/html;
            index  index.html index.htm;

            location = /index.html {
                add_header Cache-Control "no-store, no-cache, must-revalidate";
            }

            location / {
                try_files $uri $uri/ /index.html;
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            location /api {
                proxy_pass http://workspace_manager_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            error_page   500 502 503 504  /50x.html;
            location = /50x.html {
                root   /usr/share/nginx/html;
            }
        }
    }
{{- end }}
