{{- if .Values.bootstrap.admin.enabled }}
{{- $platformDatabaseCASecretName := "" }}
{{- $platformDatabaseCASecretKey := "" }}
{{- if not .Values.postgres.enabled }}
{{- $platformDatabaseCASecretName = .Values.platformDatabase.caSecretName | default "" | trim }}
{{- $platformDatabaseCASecretKey = .Values.platformDatabase.caSecretKey | default "" | trim }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aileron.fullname" . }}-admin-bootstrap
  namespace: {{ include "aileron.workspaceRuntimeNamespace" . | quote }}
  labels:
    {{- include "aileron.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-bootstrap
  annotations:
    {{- if not .Values.postgres.enabled }}
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- end }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "aileron.componentPodLabels" (dict "component" "admin-bootstrap" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- if .Values.postgres.enabled }}
      serviceAccountName: {{ include "aileron.fullname" . }}-data-service-gate
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- include "aileron.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        {{- with .Values.kubernetes.platformStorageGid }}
        fsGroup: {{ . }}
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        {{- include "aileron.waitForJobInitContainer" (dict "root" . "name" "wait-for-platform-schema" "jobName" (printf "%s-postgres-bootstrap" (include "aileron.fullname" .))) | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap-administrator
          image: {{ include "aileron.imageReference" (dict "name" "workspaceManager.image" "image" .Values.workspaceManager.image "production" .Values.security.requireStrongSecrets) | quote }}
          imagePullPolicy: {{ .Values.workspaceManager.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              exec /workspace-manager/.venv/bin/python \
                /workspace-manager/scripts/bootstrap_admin_user.py \
                --issuer "${OIDC_ISSUER_URL}" \
                --subject "${BOOTSTRAP_ADMIN_SUBJECT}" \
                --username "${BOOTSTRAP_ADMIN_USERNAME}" \
                --email "${BOOTSTRAP_ADMIN_EMAIL}"
          env:
            - name: DATABASE_URL_FILE
              value: /run/secrets/aileron/database-url
            - name: OIDC_ISSUER_URL
              value: {{ required "oidc.issuerUrl is required" .Values.oidc.issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: PLATFORM_PUBLIC_ORIGIN
              value: {{ include "aileron.platformPublicOrigin" . | quote }}
            - name: BOOTSTRAP_ADMIN_SUBJECT
              value: {{ .Values.bootstrap.admin.subject | quote }}
            - name: BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.bootstrap.admin.username | quote }}
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.bootstrap.admin.email | quote }}
            - name: PYTHONPATH
              value: /workspace-manager
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.bootstrap.admin.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: platform-secrets
              mountPath: /run/secrets/aileron
              readOnly: true
            {{- if ne $platformDatabaseCASecretName "" }}
            - name: platform-database-ca
              mountPath: /etc/aileron/data-service-ca/platform-database
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: platform-secrets
          secret:
            secretName: {{ .Values.platformSecrets.existingSecretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.platformSecrets.databaseUrlKey }}
                path: database-url
        {{- if ne $platformDatabaseCASecretName "" }}
        - name: platform-database-ca
          secret:
            secretName: {{ $platformDatabaseCASecretName }}
            defaultMode: 0444
            items:
              - key: {{ $platformDatabaseCASecretKey }}
                path: ca.crt
        {{- end }}
{{- end }}
