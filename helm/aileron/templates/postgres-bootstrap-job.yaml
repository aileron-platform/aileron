{{- $platformDatabaseCASecretName := "" }}
{{- $platformDatabaseCASecretKey := "" }}
{{- if not .Values.postgres.enabled }}
{{- $platformDatabaseCASecretName = .Values.platformDatabase.caSecretName | default "" | trim }}
{{- $platformDatabaseCASecretKey = .Values.platformDatabase.caSecretKey | default "" | trim }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aileron.fullname" . }}-postgres-bootstrap
  namespace: {{ include "aileron.workspaceRuntimeNamespace" . | quote }}
  labels:
    {{- include "aileron.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-bootstrap
  {{- if not .Values.postgres.enabled }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "aileron.componentPodLabels" (dict "component" "postgres-bootstrap" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- if .Values.postgres.enabled }}
      serviceAccountName: {{ include "aileron.fullname" . }}-data-service-gate
      automountServiceAccountToken: true
      initContainers:
        {{- include "aileron.waitForJobInitContainer" (dict "root" . "name" "wait-for-data-service-preflight" "jobName" (printf "%s-data-service-preflight" (include "aileron.fullname" .))) | nindent 8 }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- include "aileron.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        {{- with .Values.kubernetes.platformStorageGid }}
        fsGroup: {{ . }}
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      volumes:
        - name: init-sql
          configMap:
            name: {{ include "aileron.fullname" . }}-postgres-init
        - name: tmp
          emptyDir: {}
        - name: platform-database-url
          secret:
            secretName: {{ .Values.platformSecrets.existingSecretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.platformSecrets.databaseUrlKey }}
                path: database-url
        {{- if ne $platformDatabaseCASecretName "" }}
        - name: platform-database-ca
          secret:
            secretName: {{ $platformDatabaseCASecretName }}
            defaultMode: 0444
            items:
              - key: {{ $platformDatabaseCASecretKey }}
                path: ca.crt
        {{- end }}
      containers:
        - name: postgres-bootstrap
          image: {{ include "aileron.imageReference" (dict "name" "postgres.image" "image" .Values.postgres.image "production" .Values.security.requireStrongSecrets) | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          env:
            - name: DATABASE_URL_FILE
              value: /run/secrets/aileron/database-url
          volumeMounts:
            - name: init-sql
              mountPath: /init-sql
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: platform-database-url
              mountPath: /run/secrets/aileron
              readOnly: true
            {{- if ne $platformDatabaseCASecretName "" }}
            - name: platform-database-ca
              mountPath: /etc/aileron/data-service-ca/platform-database
              readOnly: true
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -lc
            - |
              set -e
              DATABASE_URL=$(cat "$DATABASE_URL_FILE")
              until pg_isready --dbname "$DATABASE_URL"; do
                echo "waiting for postgres..."
                sleep 2
              done

              echo "==> Running platform schema bootstrap..."
              psql -v ON_ERROR_STOP=1 --dbname "$DATABASE_URL" -f /init-sql/001_init_schema.sql
              echo "==> Bootstrap complete."
