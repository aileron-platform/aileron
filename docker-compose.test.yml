services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 共享測試基礎設施
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  postgres-test:
    image: postgres:15-alpine
    container_name: ai-hub-postgres-test
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_ai_hub
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - test-network

  redis-test:
    image: redis:7-alpine
    container_name: ai-hub-redis-test
    ports:
      - "6380:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Terminal Service 測試環境
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  workspace-runtime-test:
    build:
      context: ./workspace-runtime
      dockerfile: Dockerfile
      target: development
    container_name: ai-hub-workspace-runtime-test
    environment:
      - PORT=3002
      - NODE_ENV=test
      - WORKSPACE_ID=test-workspace
      - REDIS_URL=redis://redis-test:6379
      - DATABASE_URL=postgresql://test_user:test_password@postgres-test:5432/test_ai_hub
      # Terminal Service Configuration
      - TERMINAL_PORT=3004
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=debug
      - MAX_TABS_PER_WORKSPACE=10
      - SESSION_TIMEOUT=300
      - PTY_BUFFER_SIZE=1024
    ports:
      - "3005:3002"   # FastAPI
      - "3006:3004"   # Terminal Service
    volumes:
      - ./workspace-runtime:/workspace-runtime
      - ./workspace-terminal:/workspace-terminal
      - /workspace-runtime/web-preview/node_modules
    networks:
      - test-network
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

networks:
  test-network:
    driver: bridge
