[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:fastapi]
command=uv run uvicorn app.main:app --reload --reload-dir /workspace-manager/app --host 0.0.0.0 --port 3001
directory=/workspace-manager
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/fastapi.err.log
stdout_logfile=/var/log/supervisor/fastapi.out.log
environment=PYTHONPATH="/workspace-manager"

[program:celery-worker]
command=uv run celery -A app.celery.app worker --loglevel=INFO --concurrency=2 --queues=celery --prefetch-multiplier=1 --max-tasks-per-child=1000 --without-gossip --without-mingle
directory=/workspace-manager
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/celery-worker.err.log
stdout_logfile=/var/log/supervisor/celery-worker.out.log
environment=PYTHONPATH="/workspace-manager"
killasgroup=true
stopasgroup=true
priority=999

[program:celery-beat]
command=uv run celery -A app.celery.app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
directory=/workspace-manager
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/celery-beat.err.log
stdout_logfile=/var/log/supervisor/celery-beat.out.log
environment=PYTHONPATH="/workspace-manager"
killasgroup=true
stopasgroup=true
priority=997

[program:celery-flower]
command=uv run celery -A app.celery.app flower --host=0.0.0.0 --port=5555
directory=/workspace-manager
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/celery-flower.err.log
stdout_logfile=/var/log/supervisor/celery-flower.out.log
environment=PYTHONPATH="/workspace-manager"
killasgroup=true
stopasgroup=true
priority=998
