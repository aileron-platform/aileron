[supervisord]
nodaemon=true
logfile=/tmp/supervisor/supervisord.log
pidfile=/tmp/supervisor/supervisord.pid
childlogdir=/tmp/supervisor
loglevel=info

[unix_http_server]
file=/tmp/supervisor/supervisor.sock
chmod=0600

[supervisorctl]
serverurl=unix:///tmp/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:fastapi]
command=/workspace-manager/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 3001
directory=/workspace-manager
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
environment=PYTHONPATH="/workspace-manager",HOME="%(ENV_HOME)s",UV_CACHE_DIR="/tmp/uv-cache"

[program:celery-worker]
command=/workspace-manager/.venv/bin/celery -A app.celery.app worker --loglevel=INFO --concurrency=2 --queues=celery --prefetch-multiplier=1 --max-tasks-per-child=1000
directory=/workspace-manager
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
environment=PYTHONPATH="/workspace-manager",HOME="%(ENV_HOME)s",UV_CACHE_DIR="/tmp/uv-cache"
killasgroup=true
stopasgroup=true
priority=999

[program:celery-beat]
command=/workspace-manager/.venv/bin/celery -A app.celery.app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
directory=/workspace-manager
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
environment=PYTHONPATH="/workspace-manager",HOME="%(ENV_HOME)s",UV_CACHE_DIR="/tmp/uv-cache"
killasgroup=true
stopasgroup=true
priority=997

[program:celery-flower]
command=/workspace-manager/.venv/bin/celery -A app.celery.app flower --host=0.0.0.0 --port=5555
directory=/workspace-manager
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
environment=PYTHONPATH="/workspace-manager",HOME="%(ENV_HOME)s",UV_CACHE_DIR="/tmp/uv-cache"
killasgroup=true
stopasgroup=true
priority=998
