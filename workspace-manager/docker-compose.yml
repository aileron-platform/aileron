version: '3.8'

services:
  workspace-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3001:3001"
    volumes:
      - .:/workspace-manager
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://adh_user:adh_password@postgres:5432/adh_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - PYTHONPATH=/workspace-manager
      - ENVIRONMENT=development
      - RUNTIME_PROVISIONER=${RUNTIME_PROVISIONER:-docker}
      - PLATFORM=${PLATFORM:-linux}
    depends_on:
      - redis
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=adh_user
      - POSTGRES_PASSWORD=adh_password
      - POSTGRES_DB=adh_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data: