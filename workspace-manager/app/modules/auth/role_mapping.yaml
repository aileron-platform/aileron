# Keycloak role to local permission mapping configuration.
#
# This configuration defines how Keycloak roles map to Aileron local permissions.

# Role mapping rules.
role_mappings:
  # Keycloak realm roles -> local permissions.
  # Administrator role.
  admin:
    permissions:
      - "workspace:all"
      - "workspace:create"
      - "workspace:read"
      - "workspace:update"
      - "workspace:delete"
      - "workspace:share"
      - "user:manage"
      - "settings:manage"
      - "template:manage"
    description: "System administrator with all permissions"

  # Developer role.
  developer:
    permissions:
      - "workspace:create"
      - "workspace:read"
      - "workspace:update"
      - "workspace:share"
      - "template:read"
    description: "Developer who can manage workspaces and templates"

  # General user role.
  user:
    permissions:
      - "workspace:read"
      - "workspace:create"  # User-owned personal workspaces.
    description: "General user with basic workspace permissions"

  # Read-only user.
  viewer:
    permissions:
      - "workspace:read"
    description: "Read-only user who can only view"

# Default role if the user has no Keycloak roles.
default_role: "user"

# Permission groups for batch assignment.
permission_groups:
  # Full administrative permission group.
  full_access:
    roles: ["admin"]
    description: "Full system access permissions"

  # Workspace management permission group.
  workspace_management:
    roles: ["admin", "developer"]
    description: "Workspace management permissions"

  # Basic user permission group.
  basic_access:
    roles: ["user", "developer", "admin"]
    description: "Basic user access permissions"

  # Read-only access permission group.
  read_only:
    roles: ["viewer", "user", "developer", "admin"]
    description: "Read-only access permissions"

# Role inheritance. Roles can inherit permissions from other roles.
role_inheritance:
  admin:
    inherits: ["developer", "user", "viewer"]
  developer:
    inherits: ["user", "viewer"]
  user:
    inherits: ["viewer"]

# Keycloak group to local role mapping.
# Local roles can be assigned automatically from Keycloak groups.
group_mappings:
  # Keycloak group path -> local role.
  /admins:
    role: "admin"
    description: "Keycloak admins group members map to local administrators"

  /developers:
    role: "developer"
    description: "Keycloak developers group members map to local developers"

  /viewers:
    role: "viewer"
    description: "Keycloak viewers group members map to read-only users"

# Resource access control for optional fine-grained controls.
resource_access:
  # Workspace resources.
  workspaces:
    admin:
      - "create"
      - "read"
      - "update"
      - "delete"
      - "share"
      - "export"
      - "import"
    developer:
      - "create"
      - "read"
      - "update"
      - "share"
    user:
      - "create"  # Can only create own workspaces.
      - "read"    # Can only read workspaces they can access.
    viewer:
      - "read"    # Can only read workspaces they can access.

  # Template resources.
  templates:
    admin:
      - "create"
      - "read"
      - "update"
      - "delete"
    developer:
      - "read"
      - "create"
    user:
      - "read"
    viewer:
      - "read"

  # User management resources.
  users:
    admin:
      - "create"
      - "read"
      - "update"
      - "delete"
    developer:
      - "read"
    user:
      - "read"
    viewer:
      - "read"

# Custom permission rules for advanced configuration.
custom_rules:
  # Rule: allow users to manage workspaces they created.
  - name: "workspace:owner"
    condition: "user.owns_resource"
    effect: "allow"
    permissions:
      - "workspace:update"
      - "workspace:delete"
      - "workspace:share"
    description: "Users can always manage workspaces they created"

  # Rule: allow users to read workspaces shared with them.
  - name: "workspace:shared"
    condition: "workspace.shared_with_user"
    effect: "allow"
    permissions:
      - "workspace:read"
    description: "Users can read workspaces shared with them"

# Configuration notes:
# 1. Keycloak role names must match the role_mappings keys in this configuration.
# 2. Permissions are merged when a user has multiple Keycloak roles.
# 3. Role inheritance is applied automatically. For example, admin includes developer permissions.
# 4. group_mappings can assign local roles automatically from Keycloak groups.
# 5. Resource access controls can define more granular permissions.

# Example: a user has both the "developer" and "viewer" Keycloak roles.
# Result: the user receives merged developer and viewer permissions.
# Because developer inherits from user and viewer, the effective permissions include all inherited role permissions.
