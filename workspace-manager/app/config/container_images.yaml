# 容器映像配置檔
# 定義所有可用的容器映像選項，用於 Workspace 創建和容器管理

version: "1.0"

# 預設映像（與資料庫預設值保持一致）
default_image: "universal"

# 支援容器映像（Browser、Next.js 等輔助容器）
browser_image: "ailerondocker/workspace-chrome:dev-arm64"
nextjs_image: "ailerondocker/workspace-nextjs:dev-arm64"

# 可用的容器映像列表
images:
  - id: "universal"
    name: "標準容器映像"
    description: "Aileron 標準執行環境，包含 Python、Node.js、Git、SSH、Claude Code 等完整工具鏈"
    icon: "🌐"
    image: "ailerondocker/workspace-runtime:dev-lite-arm64"
    tags:
      - "universal"
      - "python"
      - "nodejs"
      - "git"
      - "ssh"
      - "claude-code"
    features:
      - "Python 3.11+"
      - "Node.js 20+"
      - "Git 版本控制"
      - "SSH 遠端存取"
      - "Claude Code CLI"
      - "Docker-in-Docker"
      - "完整開發工具鏈"
    recommended: true
    active: true
    sort_order: 1

