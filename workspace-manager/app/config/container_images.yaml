# Container image configuration.
# Defines all available container image options for workspace creation and container management.

version: "1.0"

# Default image. Keep this aligned with the database default value.
default_image: "universal"

# Supporting container images for browser, canvas, and other auxiliary containers.
browser_image: "ailerondocker/workspace-chrome:dev-arm64"
canvas_image: "ailerondocker/workspace-canvas:dev-arm64"

# Available container image list.
images:
  - id: "universal"
    name: "Standard Container Image"
    description: "Aileron standard runtime environment with a complete toolchain including Python, Node.js, Git, SSH, and Claude Code"
    icon: "🌐"
    image: "ailerondocker/workspace-runtime:dev-lite-arm64"
    tags:
      - "universal"
      - "python"
      - "nodejs"
      - "git"
      - "ssh"
      - "claude-code"
    features:
      - "Python 3.11+"
      - "Node.js 20+"
      - "Git version control"
      - "SSH remote access"
      - "Claude Code CLI"
      - "Docker-in-Docker"
      - "Complete development toolchain"
    recommended: true
    active: true
    sort_order: 1

  - id: "java"
    name: "Java 21 + Maven"
    description: "Eclipse Temurin JDK 21 (LTS) with Apache Maven 3.9, ready for Spring Boot and Maven projects"
    icon: "☕"
    image: "ailerondocker/workspace-runtime:dev-java-arm64"
    tags:
      - "java"
      - "maven"
      - "jvm"
      - "temurin"
    features:
      - "Java 21 (Temurin LTS)"
      - "Apache Maven 3.9"
      - "Inherits standard developer toolchain (Node.js, Python, Git, uv)"
      - "SSH remote access"
      - "Docker-in-Docker"
    recommended: false
    active: true
    sort_order: 2

