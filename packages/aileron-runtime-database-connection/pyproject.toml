[project]
name = "aileron-runtime-database-connection"
version = "0.1.0"
description = "Canonical Runtime database connection contract for Aileron"
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/aileron_runtime_database_connection"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"

[tool.ruff]
target-version = "py39"
