capture:
  video:
    codec: vp8
    ids: [main]
    pipelines:
      main: &main_pipeline
        fps: 25
        gst_encoder: vp8enc
        gst_params:
          target-bitrate: round(3072 * 650)
          cpu-used: 4
          end-usage: cbr
          threads: 4
          deadline: 1
          undershoot: 95
          buffer-size: (3072 * 4)
          buffer-initial-size: (3072 * 2)
          buffer-optimal-size: (3072 * 3)
          keyframe-max-dist: 25
          min-quantizer: 4
          max-quantizer: 20
        show_pointer: false
      legacy:
        <<: *main_pipeline
        show_pointer: false
