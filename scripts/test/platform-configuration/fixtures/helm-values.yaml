platformPublicOrigin: https://aileron.apps.example.com

ingress:
  tlsMode: controllerManaged

redis:
  enabled: false
  connections:
    general:
      revision: redis-general-v1
      urlSecretName: platform-redis-general
      urlSecretKey: url
    jobQueue:
      revision: redis-job-queue-v1
      urlSecretName: platform-redis-job-queue
      urlSecretKey: url
    jobResult:
      revision: redis-job-result-v1
      urlSecretName: platform-redis-job-result
      urlSecretKey: url

turn:
  enabled: true
  profile:
    backend:
      urls:
        - turn:turn.internal.example:3478
    frontend:
      urls:
        - turns:turn.example.com:5349
    credentialIssuer:
      kind: turnRest
