services:
  product-conformance-postgres:
    image: postgres:15-alpine@sha256:cae15a3b718f23497a60b7cafdcf205216d7949680972da0584db00fb68bf3e6
    platform: linux/amd64
    environment:
      POSTGRES_USER: product_conformance
      POSTGRES_PASSWORD: product_conformance
      POSTGRES_DB: aileron
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U product_conformance -d aileron
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ${AILERON_SUITE_SOURCE_ROOT:-../../../..}/init-sql/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro

  product-conformance-test:
    build:
      context: ../../../..
      dockerfile: scripts/test/kubernetes/product-conformance/Dockerfile
      args:
        SOURCE_REVISION: ${AILERON_SOURCE_REVISION:-development}
    image: ${AILERON_PRODUCT_CONFORMANCE_TEST_IMAGE:-ailerondocker/product-conformance-test:development}
    platform: linux/amd64
    working_dir: /repo/scripts/test/kubernetes/product-conformance
    depends_on:
      product-conformance-postgres:
        condition: service_healthy
    environment:
      PRODUCT_CONFORMANCE_TEST_POSTGRES_DSN: postgresql://product_conformance:product_conformance@product-conformance-postgres:5432/aileron
    volumes:
      - ${AILERON_SUITE_SOURCE_ROOT:-../../../..}:/repo:ro
    entrypoint:
      - python
      - -m
      - unittest
    command:
      - discover
      - -s
      - tests
      - -v

  kubernetes-conformance-hardening-test:
    build:
      context: ../../../..
      dockerfile: scripts/test/kubernetes/product-conformance/Dockerfile.hardening
      args:
        SOURCE_REVISION: ${AILERON_SOURCE_REVISION:-development}
    image: ${AILERON_KUBERNETES_HARDENING_TEST_IMAGE:-ailerondocker/kubernetes-hardening-test:development}
    platform: linux/amd64
    working_dir: /repo
    volumes:
      - ${AILERON_SUITE_SOURCE_ROOT:-../../../..}:/repo:ro
    command:
      - /bin/sh
      - -ec
      - |
        REPO_ROOT=/repo scripts/test/kubernetes/tests/assert-conformance-hardening.sh
        REPO_ROOT=/repo scripts/test/kubernetes/tests/assert-workspace-conformance-cr-contract.sh
