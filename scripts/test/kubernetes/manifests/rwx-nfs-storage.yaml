apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: __STORAGE_CLASS__
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - vers=4.2
  - hard
  - timeo=600
  - retrans=2
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: conformance-knowledge-bases-__RUN_ID__
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: __STORAGE_CLASS__
  mountOptions:
    - vers=4.2
    - hard
    - timeo=600
    - retrans=2
  claimRef:
    namespace: __NAMESPACE__
    name: knowledge-bases-pvc
  nfs:
    server: __NFS_SERVER__
    path: /knowledge-bases
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-bases-pvc
  namespace: __NAMESPACE__
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: __STORAGE_CLASS__
  volumeName: conformance-knowledge-bases-__RUN_ID__
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: conformance-manager-state-__RUN_ID__
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: __STORAGE_CLASS__
  mountOptions:
    - vers=4.2
    - hard
    - timeo=600
    - retrans=2
  claimRef:
    namespace: __NAMESPACE__
    name: manager-state-pvc
  nfs:
    server: __NFS_SERVER__
    path: /manager-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manager-state-pvc
  namespace: __NAMESPACE__
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: __STORAGE_CLASS__
  volumeName: conformance-manager-state-__RUN_ID__
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: conformance-workspace-__RUN_ID__
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: __STORAGE_CLASS__
  mountOptions:
    - vers=4.2
    - hard
    - timeo=600
    - retrans=2
  claimRef:
    namespace: __NAMESPACE__
    name: workspace-pvc-__WORKSPACE_ID__
  nfs:
    server: __NFS_SERVER__
    path: /workspaces/__WORKSPACE_ID__
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: conformance-runtime-home-__RUN_ID__
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - __RUNTIME_HOME_ACCESS_MODE__
  persistentVolumeReclaimPolicy: Retain
  storageClassName: __STORAGE_CLASS__
  mountOptions:
    - vers=4.2
    - hard
    - timeo=600
    - retrans=2
  claimRef:
    namespace: __NAMESPACE__
    name: workspace-runtime-home-pvc-__WORKSPACE_ID__
  nfs:
    server: __NFS_SERVER__
    path: /runtime-homes/__WORKSPACE_ID__
