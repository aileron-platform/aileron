<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 表格測試</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #333; }
        textarea {
            width: 100%;
            height: 200px;
            font-family: 'Monaco', monospace;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .preview {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 20px;
            background: #fafafa;
            min-height: 100px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
        }
        button:hover {
            background: #45a049;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
        }
        th {
            background-color: #f2f2f2;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Markdown 表格解析測試</h1>
        <textarea id="markdown-input">
| 名稱 | 類型 | 說明 |
|------|------|------|
| id | string | 唯一識別碼 |
| name | string | 名稱 |
| status | enum | 狀態 (active/inactive) |

## 對齊測試

| 靠左 | 置中 | 靠右 |
|:-----|:----:|-----:|
| A | B | C |
| 1 | 2 | 3 |
        </textarea>
        <button onclick="renderPreview()">渲染預覽</button>
        <div class="preview" id="preview"></div>
    </div>

    <script>
        // 複製 renderMarkdown 函數 (簡化版用於測試)
        const renderMarkdown = (markdown) => {
            if (!markdown) return '';

            const escapeHtml = (unsafe) =>
                unsafe
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');

            // 處理表格
            const parseTable = (lines, startIndex) => {
                const line = lines[startIndex]?.trim();
                if (!line || !line.startsWith('|')) return null;

                if (startIndex + 1 >= lines.length) return null;
                const separatorLine = lines[startIndex + 1]?.trim();
                if (!separatorLine || !separatorLine.match(/^\|[\s\-:|]+\|$/)) return null;

                const headers = line.split('|').slice(1, -1).map(h => h.trim());
                const alignments = separatorLine.split('|').slice(1, -1).map(sep => {
                    const trimmed = sep.trim();
                    if (trimmed.startsWith(':') && trimmed.endsWith(':')) return 'center';
                    if (trimmed.endsWith(':')) return 'right';
                    if (trimmed.startsWith(':')) return 'left';
                    return 'left';
                });

                const rows = [];
                let currentIndex = startIndex + 2;
                while (currentIndex < lines.length) {
                    const rowLine = lines[currentIndex]?.trim();
                    if (!rowLine || !rowLine.startsWith('|')) break;
                    const cells = rowLine.split('|').slice(1, -1).map(c => c.trim());
                    rows.push(cells);
                    currentIndex++;
                }

                const theadHtml = headers
                    .map((h, i) => `<th style="text-align:${alignments[i] || 'left'}">${h}</th>`)
                    .join('');

                const tbodyHtml = rows
                    .map(row => {
                        const cellsHtml = row
                            .map((cell, i) => `<td style="text-align:${alignments[i] || 'left'}">${cell}</td>`)
                            .join('');
                        return `<tr>${cellsHtml}</tr>`;
                    })
                    .join('');

                return {
                    html: `<table><thead><tr>${theadHtml}</tr></thead><tbody>${tbodyHtml}</tbody></table>`,
                    endIndex: currentIndex - 1
                };
            };

            const htmlParts = [];
            const lines = markdown.split('\n');
            let i = 0;

            while (i < lines.length) {
                const line = lines[i].trim();

                if (!line) {
                    i++;
                    continue;
                }

                const tableResult = parseTable(lines, i);
                if (tableResult) {
                    htmlParts.push(tableResult.html);
                    i = tableResult.endIndex + 1;
                    continue;
                }

                const headingMatch = line.match(/^(#{1,6})\s*(.*)$/);
                if (headingMatch) {
                    const level = headingMatch[1].length;
                    const headingText = headingMatch[2].trim();
                    htmlParts.push(`<h${level}>${headingText}</h${level}>`);
                    i++;
                    continue;
                }

                htmlParts.push(`<p>${line}</p>`);
                i++;
            }

            return htmlParts.join('\n');
        };

        function renderPreview() {
            const input = document.getElementById('markdown-input').value;
            const preview = document.getElementById('preview');
            preview.innerHTML = renderMarkdown(input);
        }

        // 初始渲染
        renderPreview();
    </script>
</body>
</html>
