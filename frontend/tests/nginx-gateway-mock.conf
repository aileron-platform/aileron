pid /tmp/mock-nginx.pid;

events {
    worker_connections 64;
}

http {
    server {
        listen 3001;

        location = /api/v1/workspaces/gateway/authorize {
            if ($http_x_aileron_workspace_id != "11111111-1111-4111-8111-111111111111") {
                return 403;
            }
            if ($http_cookie != "aileron_session=opaque-session") {
                return 401;
            }
            return 204;
        }
    }

    server {
        listen 3002;
        listen 3004;
        listen 6080;
        listen 3003;

        location / {
            default_type text/plain;
            return 200 "$http_cookie|$http_authorization|$http_proxy_authorization|$http_x_api_key|$http_x_csrf_token|$http_x_forwarded_prefix";
        }
    }

    server {
        listen 8083;

        location /api/v1/connectivity-evidence {
            default_type text/plain;
            return 200 "$uri|$http_authorization|$http_cookie";
        }
    }
}
