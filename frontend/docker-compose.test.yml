services:
  frontend-test:
    image: ailerondocker/workspace-ui:dev
    pull_policy: never
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - ../contracts:/contracts:ro
    command: npm run test:run

  frontend-playwright-test:
    build:
      context: .
      dockerfile: Dockerfile.playwright
      args:
        PLAYWRIGHT_IMAGE: ${PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.61.1-noble}
    image: ailerondocker/workspace-ui-playwright:test
    working_dir: /app
    ipc: host
    environment:
      CI: "1"
      PLAYWRIGHT_HTML_OPEN: never
    volumes:
      - ./e2e/__screenshots__:/app/e2e/__screenshots__
      - ./test-results:/app/test-results
    command: npm run test:e2e

  frontend-nginx-gateway-test:
    image: nginx:alpine
    depends_on:
      frontend-nginx-gateway-mock:
        condition: service_started
    volumes:
      - ./nginx.conf:/workspace/nginx.conf:ro
      - ./tests/nginx-gateway.test.sh:/workspace/nginx-gateway.test.sh:ro
    command: ["/bin/sh", "/workspace/nginx-gateway.test.sh"]

  frontend-nginx-gateway-mock:
    image: nginx:alpine
    volumes:
      - ./tests/nginx-gateway-mock.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        aliases:
          - workspace-manager
          - drawio
          - workspace-runtime-11111111-1111-4111-8111-111111111111
          - workspace-browser-11111111-1111-4111-8111-111111111111
          - workspace-canvas-11111111-1111-4111-8111-111111111111
